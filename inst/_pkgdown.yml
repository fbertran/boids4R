url: https://fbertran.github.io/boids4R/
title: "boids4R"
lang: en

news:
  one_page: true

template:
  bootstrap: 5
  bslib:
    pkgdown-nav-height: 60px
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Space Grotesk"}
    code_font: {google: "JetBrains Mono"}
  bootswatch: litera
  includes:
    in_header: |
      <style>
        .navbar-brand {
          letter-spacing: 0.02em;
        }
      </style>

development:
  mode: auto

navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - news

articles:
  - title: Articles
    navbar: Articles
    contents:
      - getting-started
      - scenario-gallery
      - custom-simulation-workflows
      - flocks-herds-swarms-schools
      - swarm-art

footer:
  structure:
    left: developed_by
    right: built_with
